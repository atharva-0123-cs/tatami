# tatami configuration
# Format: KEY = value, one per line. Lines starting with # are ignored.
# Supported keys: prefix, mouse, status_bg, status_fg, log_level, log_format,
#                 pane_gap.
# Every value can be overridden per-run via TATAMI_<KEY> env vars.
# log_format: "text" ([INFO] time file:line : message) or "json".
# pane_gap:   0-8 cells of gutter between adjacent panes (default 1).

prefix = ctrl-a
mouse = on
status_bg = #101418
status_fg = 251
pane_gap = 0
log_format = text
